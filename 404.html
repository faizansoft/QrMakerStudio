<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator Online | Page Not Found</title>
    <meta name="description" content="The QR code generator page you're looking for doesn't exist. Navigate to our homepage to create professional QR codes.">
    <link rel="canonical" href="https://qr-generator.online/">
    <script type="text/javascript">
      // This script captures the intended path and redirects to index.html
      // where the restoration script will put the user on the right page.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: Arial, sans-serif; text-align: center; padding: 50px;">
      <h1>QR Generator Online</h1>
      <p>Redirecting to the correct page...</p>
      <p>If you're not redirected automatically, <a href="/">click here</a> to go to the homepage.</p>
    </div>
  </body>
</html>
